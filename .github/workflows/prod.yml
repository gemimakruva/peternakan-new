name: Build and Deploy to Production
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  web-deploy:
    name: Auto Deploy to Devel
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v3

    - name: Use Node.js 22
      uses: actions/setup-node@v2
      with:
        node-version: '22'
      
    - name: 🔨 Build Project
      run: |
        npm install
        npm run build

    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server-dir: './peternakan/'
        server: ${{ secrets.PROD_FTP_SERVER }}
        username: ${{ secrets.PROD_FTP_USER }}
        password: ${{ secrets.PROD_FTP_PASS }}
        port: ${{ secrets.PROD_FTP_PORT }}
        exclude: |
          **/.git*
          **/.git*/**
          **/.github*
          **/.github*/**
          **/vendor/**
          **/storage/**
          **/node_modules/**
          **/.env